<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>风象全网盘搜 · 极速纯前端版</title>

<meta name="description" content="风象全网盘搜，支持百度网盘、阿里云盘、夸克、迅雷网盘资源聚合搜索。">
<meta name="theme-color" content="#111827">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --text:#111827;
    --sub:#64748b;
    --border:#e5e7eb;
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --tag:#eef2ff;
    --shadow:0 10px 30px rgba(0,0,0,.06);
    --input:#ffffff;
    --danger:#ef4444;
}

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:#1e293b;
    --primary:#3b82f6;
    --primary-hover:#60a5fa;
    --tag:#1e293b;
    --shadow:0 10px 30px rgba(0,0,0,.3);
    --input:#111827;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
    transition:.25s;
}

a{
    text-decoration:none;
}

.container{
    width:min(1280px,95%);
    margin:auto;
    padding:24px 0 60px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:999;
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,.72);
    border-bottom:1px solid rgba(255,255,255,.15);
}

body.dark .topbar{
    background:rgba(2,6,23,.7);
}

.marquee{
    overflow:hidden;
    white-space:nowrap;
    padding:10px 0;
}

.marquee-track{
    display:inline-block;
    padding-left:100%;
    animation:move 22s linear infinite;
}

.marquee a{
    color:var(--text);
    font-size:14px;
    margin-right:18px;
    background:rgba(255,255,255,.15);
    padding:8px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.1);
}

@keyframes move{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.hero{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:30px;
    padding:34px;
    margin-top:24px;
    box-shadow:var(--shadow);
}

.title{
    font-size:42px;
    font-weight:800;
    line-height:1.1;
    background:linear-gradient(135deg,#2563eb,#9333ea,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.desc{
    margin-top:12px;
    color:var(--sub);
}

.search-wrap{
    margin-top:26px;
    display:flex;
    gap:12px;
}

.search-input{
    flex:1;
    height:58px;
    border-radius:18px;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    padding:0 22px;
    font-size:17px;
    outline:none;
}

.search-input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.search-btn{
    border:none;
    background:var(--primary);
    color:white;
    padding:0 28px;
    border-radius:18px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.search-btn:hover{
    background:var(--primary-hover);
}

.meta{
    margin-top:18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.meta-item{
    background:var(--tag);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    color:var(--sub);
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:24px;
}

.chip{
    border:none;
    cursor:pointer;
    background:var(--tag);
    color:var(--text);
    border-radius:999px;
    padding:10px 16px;
    font-size:14px;
    transition:.2s;
}

.chip.active{
    background:var(--primary);
    color:white;
}

.right-tools{
    margin-left:auto;
    display:flex;
    gap:10px;
}

.tool-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    cursor:pointer;
    color:var(--text);
    font-size:18px;
}

.stats{
    margin-top:18px;
    color:var(--sub);
    font-size:14px;
}

.grid{
    margin-top:26px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
    gap:20px;
}

.card{
    background:var(--card);
    border-radius:24px;
    border:1px solid var(--border);
    overflow:hidden;
    transition:.2s;
    box-shadow:var(--shadow);
}

.card:hover{
    transform:translateY(-4px);
}

.card-body{
    padding:22px;
}

.card-title{
    font-size:19px;
    line-height:1.5;
    font-weight:700;
    word-break:break-word;
}

.tags{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.tag{
    background:var(--tag);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    color:var(--sub);
}

.note{
    margin-top:14px;
    color:var(--sub);
    line-height:1.7;
    font-size:14px;
    background:rgba(37,99,235,.05);
    padding:14px;
    border-radius:14px;
}

.open-btn{
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:48px;
    border-radius:14px;
    background:var(--primary);
    color:white;
    font-weight:700;
    transition:.2s;
}

.open-btn:hover{
    background:var(--primary-hover);
}

.footer{
    margin-top:18px;
    border-top:1px solid var(--border);
    padding:14px 22px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    color:var(--sub);
}

.empty{
    background:var(--card);
    border-radius:30px;
    border:1px solid var(--border);
    padding:80px 20px;
    text-align:center;
    color:var(--sub);
}

.loader{
    display:flex;
    justify-content:center;
    padding:60px 0;
}

.spinner{
    width:46px;
    height:46px;
    border-radius:50%;
    border:4px solid var(--border);
    border-top-color:var(--primary);
    animation:spin .6s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.load-more{
    margin:30px auto 0;
    display:block;
    border:none;
    background:var(--primary);
    color:white;
    height:48px;
    padding:0 26px;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
}

.hidden{
    display:none;
}

@media(max-width:768px){

    .title{
        font-size:32px;
    }

    .hero{
        padding:24px;
    }

    .search-wrap{
        flex-direction:column;
    }

    .search-btn{
        height:54px;
    }

    .grid{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="topbar">
    <div class="marquee">
        <div class="marquee-track">
            <a href="https://kelayun.notpin.co" target="_blank">🔥 最低月付2元1000G机场推荐</a>
            <a href="https://kelun.notpin.co" target="_blank">🚀 解锁奈飞 / TikTok / Gemini</a>
            <a href="https://kelayun.notpin.co" target="_blank">⚡ 不限速 · 不限设备 · 不限地区</a>
        </div>
    </div>
</div>

<div class="container">

    <div class="hero">

        <div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;">

            <div>
                <div class="title">风象全网盘搜</div>
                <div class="desc">
                    极速纯前端盘搜 · 百度 / 阿里 / 夸克 / 迅雷聚合搜索
                </div>
            </div>

            <div class="right-tools">
                <button class="tool-btn" id="themeBtn">🌙</button>
            </div>

        </div>

        <div class="search-wrap">

            <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="输入电影、剧集、短剧、动漫、书籍、软件..."
            autocomplete="off"
            >

            <button class="search-btn" id="searchBtn">
                🔍 搜索
            </button>

        </div>

        <div class="meta">
            <div class="meta-item">⚡ GitHub Pages 可直接部署</div>
            <div class="meta-item">🚀 本地缓存加速</div>
            <div class="meta-item">📂 智能网盘分类</div>
            <div class="meta-item">🛡️ XSS 安全过滤</div>
        </div>

        <div class="toolbar" id="toolbar"></div>

        <div class="stats" id="stats">
            输入关键词开始搜索
        </div>

    </div>

    <div class="grid" id="results">

        <div class="empty">
            🚀 风象全网盘搜已就绪<br><br>
            💡 试试搜索：死神来了 / 蜜语纪 / 短剧 / 4K
        </div>

    </div>

    <button id="loadMoreBtn" class="load-more hidden">
        加载更多
    </button>

</div>

<script>

(() => {

const API =
'https://proxy.api.030101.xyz/https://so.252035.xyz/api/search?kw=';

const CACHE_KEY = 'fx-pan-cache-v3';

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
const toolbar = document.getElementById('toolbar');
const loadMoreBtn = document.getElementById('loadMoreBtn');

let currentResults = [];
let currentFilter = '全部';
let currentKeyword = '';

let page = 1;
const pageSize = 20;

let controller = null;

const memoryCache = loadCache();

function loadCache(){
    try{
        return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    }catch{
        return {};
    }
}

function saveCache(){
    localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(memoryCache)
    );
}

function debounce(fn, delay=400){
    let timer;
    return (...args)=>{
        clearTimeout(timer);
        timer = setTimeout(()=>{
            fn(...args);
        }, delay);
    };
}

function escapeHtml(str=''){
    return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function safeUrl(url=''){
    try{
        const u = new URL(url);

        if(
            u.protocol === 'http:' ||
            u.protocol === 'https:'
        ){
            return u.href;
        }

        return '#';

    }catch{
        return '#';
    }
}

function getDiskType(url=''){

    if(url.includes('pan.baidu.com')){
        return '百度网盘';
    }

    if(url.includes('aliyundrive.com')){
        return '阿里云盘';
    }

    if(url.includes('quark.cn')){
        return '夸克网盘';
    }

    if(
        url.includes('xunlei.com') ||
        url.includes('pan.xunlei.com')
    ){
        return '迅雷网盘';
    }

    return '其他';
}

function getDiskEmoji(type){

    if(type==='百度网盘') return '📀';
    if(type==='阿里云盘') return '☁️';
    if(type==='夸克网盘') return '⚛️';
    if(type==='迅雷网盘') return '⚡';

    return '🔗';
}

function formatDate(date){

    if(!date){
        return '时间未知';
    }

    try{
        return new Date(date)
        .toLocaleDateString('zh-CN');
    }catch{
        return '时间未知';
    }

}

function renderToolbar(){

    if(!currentResults.length){
        toolbar.innerHTML = '';
        return;
    }

    const countMap = {};

    currentResults.forEach(item=>{
        const type = getDiskType(item.url);

        countMap[type] =
        (countMap[type] || 0) + 1;
    });

    let html = '';

    const allCount = currentResults.length;

    html += `
    <button class="chip ${
        currentFilter==='全部'
        ? 'active'
        : ''
    }" data-filter="全部">
        全部 (${allCount})
    </button>
    `;

    Object.keys(countMap).forEach(type=>{

        html += `
        <button
        class="chip ${
            currentFilter===type
            ? 'active'
            : ''
        }"
        data-filter="${type}">
            ${getDiskEmoji(type)}
            ${type}
            (${countMap[type]})
        </button>
        `;

    });

    toolbar.innerHTML = html;

    document
    .querySelectorAll('.chip')
    .forEach(btn=>{

        btn.onclick = ()=>{

            currentFilter =
            btn.dataset.filter;

            page = 1;

            renderToolbar();
            renderResults();

        };

    });

}

function renderResults(){

    let data = [...currentResults];

    if(currentFilter !== '全部'){

        data = data.filter(item => {
            return getDiskType(item.url)
            === currentFilter;
        });

    }

    if(!data.length){

        results.innerHTML = `
        <div class="empty">
            😞 当前筛选下暂无资源
        </div>
        `;

        loadMoreBtn.classList.add('hidden');

        return;
    }

    const renderData =
    data.slice(0, page * pageSize);

    results.innerHTML =
    renderData.map(renderCard).join('');

    if(renderData.length < data.length){

        loadMoreBtn.classList.remove('hidden');

    }else{

        loadMoreBtn.classList.add('hidden');

    }

    stats.innerHTML = `
    ✅ 共 ${data.length} 条结果
    · 当前筛选：${currentFilter}
    · 已启用本地缓存
    `;

}

function renderCard(item){

    const title =
    escapeHtml(item.note || '未知资源');

    const url =
    safeUrl(item.url);

    const type =
    getDiskType(item.url);

    const note =
    escapeHtml(item.note || '');

    const password =
    escapeHtml(item.password || '');

    const source =
    escapeHtml(item.source || '未知');

    return `
    <div class="card">

        <div class="card-body">

            <div class="card-title">
                ${title}
            </div>

            <div class="tags">

                <div class="tag">
                    ${getDiskEmoji(type)}
                    ${type}
                </div>

                <div class="tag">
                    📅 ${formatDate(item.datetime)}
                </div>

                <div class="tag">
                    📡 ${source}
                </div>

                ${
                    password
                    ?
                    `
                    <div class="tag">
                        🔑 ${password}
                    </div>
                    `
                    :
                    ''
                }

            </div>

            ${
                note
                ?
                `
                <div class="note">
                    ${note.slice(0,160)}
                </div>
                `
                :
                ''
            }

            <a
            href="${url}"
            target="_blank"
            rel="noopener noreferrer nofollow"
            class="open-btn">

                📂 打开资源

            </a>

        </div>

        <div class="footer">

            <span>
                ✨ ${source}
            </span>

            <span>
                ${password ? '🔐 有密码' : '🔓 无密码'}
            </span>

        </div>

    </div>
    `;
}

function showLoading(){

    results.innerHTML = `
    <div class="loader">
        <div class="spinner"></div>
    </div>
    `;

}

async function search(keyword){

    keyword = keyword.trim();

    if(!keyword){

        stats.innerHTML =
        '⚠️ 请输入关键词';

        return;
    }

    currentKeyword = keyword;
    currentFilter = '全部';
    page = 1;

    if(controller){
        controller.abort();
    }

    controller =
    new AbortController();

    const signal =
    controller.signal;

    const cacheData =
    memoryCache[keyword];

    if(
        cacheData &&
        Date.now() - cacheData.time
        < 1000 * 60 * 60 * 12
    ){

        currentResults =
        cacheData.data;

        renderToolbar();
        renderResults();

        stats.innerHTML = `
        ⚡ 本地缓存命中
        · ${currentResults.length} 条结果
        `;

        return;
    }

    showLoading();

    try{

        const res = await fetch(
            API + encodeURIComponent(keyword),
            {
                signal
            }
        );

        const json =
        await res.json();

        if(
            json.code !== 0 ||
            !json.data
        ){
            throw new Error('接口异常');
        }

        let merged = [];

        const raw =
        json.data.merged_by_type || {};

        Object.keys(raw).forEach(key=>{

            if(Array.isArray(raw[key])){

                merged =
                merged.concat(raw[key]);

            }

        });

        const uniqueMap = new Map();

        merged.forEach(item=>{

            const key =
            (item.url || '') +
            (item.note || '');

            if(!uniqueMap.has(key)){

                uniqueMap.set(key,item);

            }

        });

        currentResults =
        [...uniqueMap.values()];

        memoryCache[keyword] = {
            time: Date.now(),
            data: currentResults
        };

        saveCache();

        renderToolbar();
        renderResults();

    }catch(err){

        if(err.name === 'AbortError'){
            return;
        }

        results.innerHTML = `
        <div class="empty">
            ❌ 搜索失败<br><br>
            ${escapeHtml(err.message)}
        </div>
        `;

    }

}

const debouncedSearch =
debounce(search,300);

searchBtn.onclick = ()=>{

    debouncedSearch(
        searchInput.value
    );

};

searchInput.addEventListener(
'keydown',
e=>{

    if(e.key === 'Enter'){

        debouncedSearch(
            searchInput.value
        );

    }

});

loadMoreBtn.onclick = ()=>{

    page++;

    renderResults();

};

const themeBtn =
document.getElementById('themeBtn');

if(
    localStorage.getItem('theme')
    === 'dark'
){
    document.body.classList.add('dark');
    themeBtn.innerHTML = '☀️';
}

themeBtn.onclick = ()=>{

    document.body.classList.toggle('dark');

    const dark =
    document.body.classList.contains('dark');

    localStorage.setItem(
        'theme',
        dark ? 'dark' : 'light'
    );

    themeBtn.innerHTML =
    dark ? '☀️' : '🌙';

};

})();
</script>

</body>
</html>
